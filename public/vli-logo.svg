<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="100%" height="100%">
  <defs>
    <linearGradient id="vliYellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB81C" />
      <stop offset="100%" stop-color="#F5A800" />
    </linearGradient>
  </defs>
  <!-- VLI Corporate Logo Graphic -->
  <g transform="translate(4, 5)">
    <!-- V -->
    <path d="M0 4 L14 36 L24 36 L38 4 L26 4 L19 22 L12 4 Z" fill="#002B49" />
    <!-- Dynamic logistics stripe inside V -->
    <path d="M12 4 L19 22 L16 28 L9 11 Z" fill="url(#vliYellowGrad)" />

    <!-- L -->
    <path d="M42 4 L42 36 L66 36 L66 26 L54 26 L54 4 Z" fill="#002B49" />
    
    <!-- I with Yellow Crown / Point -->
    <path d="M72 4 L72 36 L84 36 L84 4 Z" fill="#002B49" />
    <polygon points="72,4 84,4 84,0 72,0" fill="url(#vliYellowGrad)" />

    <!-- Railway track forward arrow accent -->
    <path d="M92 20 L106 20 L112 14 L112 26 L106 20" fill="url(#vliYellowGrad)" />
    <line x1="92" y1="20" x2="148" y2="20" stroke="#002B49" stroke-width="3" stroke-linecap="round" />
    
    <!-- Slogan text -->
    <text x="94" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#64748B" letter-spacing="1">LOGÍSTICA</text>
  </g>
</svg>
